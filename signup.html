</head>
<body>
<header class="topbar"><div class="topbar-title">Inventory Management System</div><div class="topbar-right">Admin</div></header>
<aside class="sidebar" id="sidebar">
<div class="sidebar-title">Main Menu</div>
<a href="index.html">Dashboard</a><a href="products.html">Products</a><a href="categories.html">Categories</a><a href="suppliers.html">Suppliers</a><a href="customers.html">Customers</a><a href="purchases.html">Purchase Products</a><a href="sales.html">Outgoing Products</a><a href="stock.html">Stock</a><a href="orders.html">Orders</a><a href="delivery.html">Delivery</a><a href="reports.html">Reports</a>

<main class="main">
<h1 class="page-title">System Users</h1><p class="page-subtitle">Add a new system user.</p>
<section class="panel login-box"><div class="panel-header"><h2>Create User</h2></div><div class="panel-body"><form id="form">
<div class="form-group"><label>Username</label><input name="username" required></div>
<div class="form-group"><label>Email</label><input type="email" name="email" required></div>
<div class="form-group"><label>Password</label><input type="password" name="password" required></div>
<div class="form-actions"><button class="btn" type="submit">Create User</button></div><p id="message" class="message"></p>
</form></div></section>
</main>
<script src="script.js"></script>
<script>
document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();try{await api("/api/signup",{method:"POST",body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});showMessage("message","User created successfully");e.target.reset()}catch(err){showMessage("message",err.message,"error")}});
</script>
</body>
</html>
