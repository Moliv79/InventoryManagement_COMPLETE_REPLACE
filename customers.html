<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customers | Inventory Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
    <div class="topbar-title">Inventory Management System</div>
</header>
<aside class="sidebar" id="sidebar">
    <div class="sidebar-title">Main Menu</div>
    <a href="index.html">Dashboard</a>
    <a href="products.html">Products</a>
    <a href="categories.html">Categories</a>
    <a href="suppliers.html">Suppliers</a>
    <a href="customers.html">Customers</a>
    <a href="purchases.html">Purchase Products</a>
    <a href="sales.html">Outgoing Products</a>
    <a href="stock.html">Stock</a>
    <a href="orders.html">Orders</a>
    <a href="delivery.html">Delivery</a>
    <a href="reports.html">Reports</a>
</aside>
<main class="main">

<h1 class="page-title">Customers</h1>
<p class="page-subtitle">Manage customer information.</p>

<div id="message" class="message"></div>

<section class="panel">
    <div class="panel-header"><h2>Add Customer</h2></div>
    <div class="panel-body">
        <form id="customerForm">
            <div class="form-grid">
                <div class="form-group"><label>Customer Name</label><input id="customer_name" required></div>
                <div class="form-group"><label>Email</label><input id="email" type="email"></div>
                <div class="form-group"><label>Phone</label><input id="phone"></div>
                <div class="form-group"><label>Address</label><input id="address"></div>
            </div>
            <div class="form-actions"><button class="btn">Add Customer</button></div>
        </form>
    </div>
</section>

<section class="panel">
    <div class="panel-header"><h2>Customer List</h2></div>
    <div class="panel-body table-wrap">
        <table>
            <thead><tr><th>ID</th><th>Customer</th><th>Email</th><th>Phone</th><th>Address</th><th>Orders</th><th>Action</th></tr></thead>
            <tbody id="customerTable"></tbody>
        </table>
    </div>
</section>

</main>
<script src="script.js"></script>

<script>
async function loadCustomersPage() {
    const rows = await api("/api/customers");
    document.getElementById("customerTable").innerHTML = rows.length ? rows.map(c => `
        <tr>
            <td>${c.customer_id}</td>
            <td>${escapeHtml(c.customer_name)}</td>
            <td>${escapeHtml(c.email || "-")}</td>
            <td>${escapeHtml(c.phone || "-")}</td>
            <td>${escapeHtml(c.address || "-")}</td>
            <td>${c.order_count}</td>
            <td><button class="btn btn-small btn-danger" onclick="deleteCustomer(${c.customer_id})">Delete</button></td>
        </tr>
    `).join("") : '<tr><td colspan="7" class="empty">No customers found.</td></tr>';
}

async function deleteCustomer(id) {
    if (!confirm("Delete this customer?")) return;
    try {
        await api(`/api/customers/${id}`, { method: "DELETE" });
        await loadCustomersPage();
    } catch (error) {
        alert(error.message);
    }
}

document.addEventListener("DOMContentLoaded", async () => {
    await loadCustomersPage();
    document.getElementById("customerForm").addEventListener("submit", async event => {
        event.preventDefault();
        try {
            await api("/api/customers", {
                method: "POST",
                body: JSON.stringify({
                    customer_name: document.getElementById("customer_name").value.trim(),
                    email: document.getElementById("email").value.trim(),
                    phone: document.getElementById("phone").value.trim(),
                    address: document.getElementById("address").value.trim()
                })
            });
            event.target.reset();
            showMessage("message", "Customer added successfully.");
            await loadCustomersPage();
        } catch (error) {
            showMessage("message", error.message, "error");
        }
    });
});
</script>

</body>
</html>
